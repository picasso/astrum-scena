<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrum Scena — icon sizes</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; width: 678px; color: #161616; background: #eee; font: 14px Arial, sans-serif; }
h1 { margin: 0 0 24px; font-size: 18px; font-weight: 500; }
.labels, .samples { display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; justify-items: center; }
.labels { margin: 0 0 12px; color: #555; }
.samples { min-height: 112px; }
.light { background: white; }
.dark { background: black; }
.theme { margin: 16px 0 8px; color: #555; font-size: 12px; }
.icon { position: relative; overflow: hidden; width: var(--size); height: var(--size); flex: none; }
.icon img { position: absolute; display: block; width: 145.814%; height: 145.814%; max-width: none; left: -22.791%; top: -19.651%; }
.dark img { filter: url(#icon-dark); }
.note { margin: 16px 0 0; color: #555; font-size: 12px; }
</style>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><filter id="icon-dark" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="-0.08670143 -0.99380704 0 0 1.08050847 -1.08670143 0.00619296 0 0 1.08050847 -0.9600046 -0.12050387 0 0 1.08050847 0 0 0 1 0"/></filter></defs></svg>
<h1>Astrum Scena · размер иконки</h1>
<div class="labels"><span>16 px</span><span>24 px</span><span>32 px</span><span>48 px</span><span>64 px</span></div>
<div class="samples light" aria-label="На светлом фоне">
  <div class="icon" style="--size:16px"><img src="01-stage-v4.png" alt="Знак 16 пикселей"></div>
  <div class="icon" style="--size:24px"><img src="01-stage-v4.png" alt="Знак 24 пикселя"></div>
  <div class="icon" style="--size:32px"><img src="01-stage-v4.png" alt="Знак 32 пикселя"></div>
  <div class="icon" style="--size:48px"><img src="01-stage-v4.png" alt="Знак 48 пикселей"></div>
  <div class="icon" style="--size:64px"><img src="01-stage-v4.png" alt="Знак 64 пикселя"></div>
</div>
<p class="theme">На тёмном фоне · алый акцент сохранён</p>
<div class="samples dark" aria-label="На тёмном фоне">
  <div class="icon" style="--size:16px"><img src="01-stage-v4.png" alt="Знак 16 пикселей"></div>
  <div class="icon" style="--size:24px"><img src="01-stage-v4.png" alt="Знак 24 пикселя"></div>
  <div class="icon" style="--size:32px"><img src="01-stage-v4.png" alt="Знак 32 пикселя"></div>
  <div class="icon" style="--size:48px"><img src="01-stage-v4.png" alt="Знак 48 пикселей"></div>
  <div class="icon" style="--size:64px"><img src="01-stage-v4.png" alt="Знак 64 пикселя"></div>
</div>
<p class="note">Размеры показаны без увеличения. Большие внешние поля исходного эскиза убраны.</p>
</html>
