name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

# A new push to a PR cancels its stale run; pushes to main are grouped by sha and never cancelled.
concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    gates:
        runs-on: ubuntu-latest
        steps:
            # the full history: on a PR the API gate reads the snapshot at the merge base with main
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # check:identity reads the owner's strings only from this secret; without it the gate fails
            # here, since CI is set (outside CI it only warns).
            - name: Gates (pnpm check)
              run: pnpm check
              env:
                  IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}

            - name: Build (core, demo against the workspace core)
              run: pnpm build

            # a breaking change of the core's API against the merge base must be named in a
            # `**Breaking:**` entry under [Unreleased] in CHANGELOG.md (or the section of the repository
            # version the branch bumps to) and in an UPGRADING.md entry;
            # a bump of the core's npm version must match the transitions of UPGRADING.md: under 1.0.0
            # any higher version, breaking when UPGRADING.md has a section for it; from 1.0.0 on semver
            - name: Breaking API changes (against the merge base with main)
              if: github.event_name == 'pull_request'
              run: pnpm check:api-breaking --base origin/main

    # The demo gets the core the way a site does: the `pnpm pack` tarball installed outside the
    # workspace, then `astro build` with cwd at the site root (ADR-0016). Its site directory, with the
    # tarball, a relative link to it and the lockfile, is the artifact the `demo` job builds.
    demo-site:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build the demo from the packed core
              run: pnpm demo:packed --out .cache/demo-site

            # what a site repository holds: no installed packages and no build outputs
            - name: Drop the install and the build of the demo site
              run: rm -rf node_modules dist .astro
              working-directory: .cache/demo-site/site

            - name: Upload the demo site
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: demo-site
                  path: .cache/demo-site/site/
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 7

    # The demo through the core's own site.yml, as a site runs it: the gates and the build pass, and
    # live and deploy are skipped with a notice.
    demo:
        needs: demo-site
        uses: ./.github/workflows/site.yml
        # deploy asks for deployments: write, which the caller must grant even when it never deploys
        permissions:
            contents: read
            deployments: write
        with:
            site-artifact: demo-site
            deploy: false
            live-checks: false

    # Functional e2e and the visual baselines of the core on the demo built from the packed core, in the
    # Playwright image whose version matches @playwright/test (scripts/run-e2e.test.ts checks the tag).
    # CI only compares the baselines; they are rendered with `pnpm test:e2e:docker:update`.
    e2e:
        runs-on: ubuntu-latest
        container:
            image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
        env:
            CI: 'true'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Build the demo from the packed core and run Playwright
              run: pnpm test:e2e

            # test-results/ holds the actual and diff PNGs of a failed snapshot
            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-playwright-report
                  path: |
                      playwright-report/
                      test-results/
                  retention-days: 7

    # The commit-msg hook runs only where it is installed, so every commit of the PR (base..head) is
    # checked again here.
    commit-messages:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc

            - name: Check commit messages of the PR
              run: node --experimental-strip-types scripts/check-commit-msg.ts --range "$BASE_SHA..$HEAD_SHA"
              env:
                  IDENTITY_DENYLIST: ${{ secrets.IDENTITY_DENYLIST }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
